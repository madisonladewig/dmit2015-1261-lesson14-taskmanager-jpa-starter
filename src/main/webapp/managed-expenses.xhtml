<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:faces="jakarta.faces"
        xmlns:ui="jakarta.faces.facelets"
        xmlns:f="jakarta.faces.core"
        xmlns:h="jakarta.faces.html"
        xmlns:pt="jakarta.faces.passthrough"
        xmlns:cc="jakarta.faces.composite"
        xmlns:c="jakarta.tags.core"
        xmlns:fn="jakarta.tags.functions"
        xmlns:o="http://omnifaces.org/ui"
        xmlns:of="http://omnifaces.org/functions"
        xmlns:p="primefaces"
        template="/WEB-INF/faces-templates/layout.xhtml"
>

    <ui:param name="title" value="Expenses - CRUD"/>

    <ui:param name="internalstyles"
              value=".Expensess-table-header { display: flex; align-items:center; justify-content: space-between; flex-wrap: wrap; }"/>

    <ui:define name="maincontent">

        <div class="card">
            <h:form id="form">
                <p:growl id="growl" showDetail="true">
                    <p:autoUpdate/>
                </p:growl>

                <p:toolbar>
                    <p:toolbarGroup>
                        <p:commandButton id="newButton"
                                         value="New"
                                         icon="pi pi-plus"
                                         actionListener="#{currentExpensesCrudView.onOpenNew}"
                                         update=":dialogs:manage-Expenses-content"
                                         oncomplete="PF('manageExpensesDialog').show()"
                                         styleClass="ui-button-success"
                                         style="margin-right: .5rem">
                            <p:resetInput target=":dialogs:manage-Expenses-content"/>
                        </p:commandButton>
                    </p:toolbarGroup>
                </p:toolbar>

                <p:dataTable id="dt-Expensess" widgetVar="dtExpensess"
                             value="#{currentExpensesCrudView.expensess}"
                             var="currentItem"
                             reflow="true"
                             selection="#{currentExpensesCrudView.selectedExpenses}"
                             rowKey="#{currentItem.}"
                             paginator="true" rows="10"
                             paginatorPosition="bottom">

                    <f:facet name="header">
                        <div class="Expensess-table-header">
                            <span style="font-weight: bold">Expensess</span>
                            <span class="filter-container ui-input-icon-left">
                                <i class="pi pi-search"></i>
                                <p:inputText id="globalFilter" onkeyup="PF('dtExpensess').filter()"
                                             placeholder="Search"/>
                            </span>
                        </div>
                    </f:facet>

                    <!-- TODO: add p:column for each property of the entity to display -->
                    <p:column headerText="Description" filterBy="#{currentItem.description}">
                        <h:outputText value="#{currentItem.description}"/>
                    </p:column>
                    <p:column headerText="Date" filterBy="#{currentItem.date}">
                        <h:outputText value="#{currentItem.date}">
                            <f:convertDateTime type="localDate" />
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Amount">
                        <h:outputText value="#{currentItem.amount}">
                            <f:convertNumber type="currency" />
                        </h:outputText>
                    </p:column>

                    <p:column exportable="false" ariaHeaderText="Actions">
                        <p:commandButton icon="pi pi-pencil"
                                         update=":dialogs:manage-Expenses-content"
                                         oncomplete="PF('manageExpensesDialog').show()"
                                         styleClass="edit-button rounded-button ui-button-success"
                                         process="@this">
                            <f:setPropertyActionListener value="#{currentItem}"
                                                         target="#{currentExpensesCrudView.selectedExpenses}"/>
                            <f:setPropertyActionListener value="#{currentItem.}"
                                                         target="#{currentExpensesCrudView.selectedId}"/>
                            <p:resetInput target=":dialogs:manage-Expenses-content"/>
                        </p:commandButton>
                        <p:commandButton class="ui-button-warning rounded-button" icon="pi pi-trash"
                                         process="@this"
                                         oncomplete="PF('deleteExpensesDialog').show()">
                            <f:setPropertyActionListener value="#{currentItem}"
                                                         target="#{currentExpensesCrudView.selectedExpenses}"/>
                            <f:setPropertyActionListener value="#{currentItem.}"
                                                         target="#{currentExpensesCrudView.selectedId}"/>
                        </p:commandButton>
                    </p:column>

                </p:dataTable>
            </h:form>

            <h:form id="dialogs">
                <p:dialog header="Expenses Details" showEffect="fade" modal="true" widgetVar="manageExpensesDialog"
                          responsive="true">

                    <p:messages id="messages">
                        <p:autoUpdate/>
                    </p:messages>

                    <p:outputPanel id="manage-Expenses-content" class="ui-fluid">
                        <p:outputPanel rendered="#{not empty currentExpensesCrudView.selectedExpenses}">
                            <div class="field">
                                <p:outputLabel for="@next">Description</p:outputLabel>
                                <p:inputText
                                        id="description"
                                        value="#{currentExpensesCrudView.selectedExpense.description}">
                                </p:inputText>
                            </div>
                            <div class="field">
                                <p:outputLabel for="@next">Amount</p:outputLabel>
                                <p:inputNumber
                                        id="amount"
                                        value="#{currentExpensesCrudView.selectedExpense.Amount}">
                                </p:inputNumber>
                            </div>
                            <div>
                                <p:outputLabel for="@next">Date</p:outputLabel>
                                <p:datePicker id="date"
                                              value="#{currentExpenseCrudView.selectedExpense.date}"
                                              pattern="yyyy-MM-dd"
                                              showIcon="true">
                                </p:datePicker>
                            </div>

                        </p:outputPanel>
                    </p:outputPanel>

                    <f:facet name="footer">
                        <p:commandButton id="saveButton"
                                         value="Save"
                                         icon="pi pi-check"
                                         actionListener="#{currentExpensesCrudView.onSave}"
                                         update="manage-Expenses-content"
                                         process="manage-Expenses-content @this"/>

                        <p:commandButton id="generateDataButton"
                                         value="Generate Data"
                                         icon="pi pi-calculator"
                                         actionListener="#{currentExpensesCrudView.onGenerateData}"
                                         update="manage-Expenses-content"
                                         process="@this"/>

                        <p:commandButton id="cancelButton"
                                         value="Cancel"
                                         icon="pi pi-times"
                                         onclick="PF('manageExpensesDialog').hide()"
                                         class="ui-button-secondary"
                                         type="button"/>
                    </f:facet>
                </p:dialog>

                <p:confirmDialog widgetVar="deleteExpensesDialog" showEffect="fade" width="300"
                                 message="Delete the Expenses?" header="Confirm" severity="warn">
                    <p:commandButton value="Yes" icon="pi pi-check" actionListener="#{currentExpensesCrudView.onDelete}"
                                     process="@this"
                                     oncomplete="PF('deleteExpensesDialog').hide()"/>
                    <p:commandButton value="No" type="button" styleClass="ui-button-secondary" icon="pi pi-times"
                                     onclick="PF('deleteExpensesDialog').hide()"/>
                </p:confirmDialog>

                <p:confirmDialog global="true" showEffect="fade" width="300">
                    <p:commandButton value="Yes" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check"/>
                    <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-secondary"
                                     icon="pi pi-times"/>
                </p:confirmDialog>
            </h:form>

        </div>

    </ui:define>

</ui:composition>
